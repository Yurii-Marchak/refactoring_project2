name: CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-analyze:
    name: Build, Test and SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pymongo motor pytest pytest-cov mockito httpx python-dotenv mongomock jinja2 python-multipart
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi


    - name: Run Tests with Coverage
      env:
        PYTHONPATH: src
      run: |
        pytest --junitxml=junit.xml --cov=src --cov-report=xml:coverage.xml --cov-report=html:htmlcov tests/


    - name: Upload Test & Coverage HTML Reports
      uses: actions/upload-artifact@v4
      with:
        name: test-and-coverage-artifacts
        path: |
          htmlcov/
          junit.xml
          coverage.xml
        retention-days: 7


    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}